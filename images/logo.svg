<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F284E"/>
      <stop offset="100%" stop-color="#1A3E72"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF5100"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Icon Symbol: Tangent Geometric Touchpoint -->
  <g transform="translate(10, 10)">
    <!-- Base geometric hexagon/shield -->
    <rect x="0" y="0" width="70" height="70" rx="16" fill="url(#primaryGrad)"/>
    <!-- Orange Dynamic Tangent Ray / Arrow Arc -->
    <path d="M15 52 C 22 28, 42 18, 55 18" stroke="url(#orangeGrad)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <circle cx="55" cy="18" r="4.5" fill="#FF7A00"/>
    <!-- Intersecting 'T' & 'A' monogram geometry -->
    <path d="M22 26 L48 26 M35 26 L35 48" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 48 L53 30 L60 48 M47 42 L57 42" stroke="#FF7A00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(95, 38)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="24" fill="#0B1A30" letter-spacing="1.5">TANGENT <tspan fill="#FF6500">ALLIED</tspan></text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="11.5" fill="#5A6E85" letter-spacing="3.2">ENTERPRISE LLP</text>
  </g>
</svg>

